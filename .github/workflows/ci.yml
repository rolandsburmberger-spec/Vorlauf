name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # M0: Die 10 Rechenkern-Tests sind bewusst rot (Sollliste für M1).
      # Sobald M1 abgeschlossen ist, ist dieser Schritt der harte Gate.
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
